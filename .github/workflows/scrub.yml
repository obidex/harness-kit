# O09 enforced on the kit's own repository (K006): the same scrubber the kit installs in every project
# Action group: auto (it checks, reports, alerts or wakes by itself; .harness/tools/actions.mjs)
# as harness-scrub.yml. Right after an issue, PR, comment or review is posted or edited, removes
# "Generated by Claude Code" lines, Claude co-author and session lines, and claude.ai links from its
# body (.harness/tools/scrub.mjs). It checks out only the default branch's .harness/tools, never the
# PR's code, and treats the body as data. PRs use pull_request, never pull_request_target (K030, A19):
# a fork's or Dependabot's PR gets a read-only token, so its body is left as it is, with a warning. Its own edit is made
# with GITHUB_TOKEN, whose events start no workflow, so it cannot loop. This repository is public, so
# it runs on GitHub-hosted runners at no cost and never on a self-hosted one (anyone can comment).
name: scrub

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  # issues and comments: one run going and one waiting for the repository; each run sweeps what a dropped
  # one named (K059); a pull request's own events: one group per pull request
  group: scrub-${{ ((github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')) || github.actor == 'github-actions[bot]') && github.run_id || github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read    # its own run list: where the sweep starts (K059)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .harness/tools
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Remove Claude attribution from the body
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCRUB_SWEEP: ${{ (github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')) && 'off' || 'on' }}
        run: node .harness/tools/scrub.mjs
