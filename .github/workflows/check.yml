# Action group: auto (it checks, reports, alerts or wakes by itself; .harness/tools/actions.mjs)
name: check

on:
  pull_request:
    # edited: a description changed after the check ran is judged again (O09)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: check-kit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: No Claude footer in the pull request description (O09)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .harness/tools/guard.mjs pr-body --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
      - run: node tools/check-kit.mjs
      - name: A change to the kit is a new version
        if: github.event_name == 'pull_request'
        run: node tools/check-version.mjs "origin/${{ github.base_ref }}"
      - name: Initializer and updater, end to end
        run: node tools/test-harness.mjs
      - name: Attribution scrubber
        run: node tools/test-scrub.mjs
      - name: Settings as code and the hands workflows
        run: node tools/test-hands.mjs
      - name: Inbox (cross-project requests)
        run: node tools/test-inbox.mjs
      - name: Event-fired coordinators (wake)
        run: node tools/test-wake.mjs
      - name: Alerts (the notification standard)
        run: node tools/test-notify.mjs
      - name: Control panel (one scenario, every channel)
        run: node tools/test-panel.mjs
      - name: Questions answered from the panel
        run: node tools/test-ask.mjs
      - name: Explain this failure (requests and answers)
        run: node tools/test-explain.mjs
      - name: Supply-chain floor (harness-guard and the audit's A17-A22)
        run: node tools/test-guard.mjs
      - name: Stale-work check and the kit workflows' runner lane
        run: node tools/test-stale.mjs
      - name: Action groups (auto, approval; never human)
        run: node tools/test-actions.mjs
      - name: Always-loaded token budget (load)
        run: node tools/test-load.mjs
      - name: Agent metrics (the health page's numbers)
        run: node tools/test-metrics.mjs
      - name: Replay set and its grader
        run: node tools/test-replay.mjs
