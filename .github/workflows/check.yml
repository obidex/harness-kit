name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: check-kit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tools/check-kit.mjs
      - name: A change to the kit is a new version
        if: github.event_name == 'pull_request'
        run: node tools/check-version.mjs "origin/${{ github.base_ref }}"
      - name: Initializer and updater, end to end
        run: node tools/test-harness.mjs
      - name: Attribution scrubber
        run: node tools/test-scrub.mjs
      - name: Settings as code and the hands workflows
        run: node tools/test-hands.mjs
      - name: Inbox (cross-project requests)
        run: node tools/test-inbox.mjs
      - name: Alerts (the notification standard)
        run: node tools/test-notify.mjs
      - name: Stale-work check and the kit workflows' runner lane
        run: node tools/test-stale.mjs
