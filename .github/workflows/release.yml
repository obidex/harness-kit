# Releases are tags: when main carries a .harness/VERSION that has no tag yet, tag that commit
# v<VERSION>. A tag is never moved or deleted (K003); projects' locks record the commit it named.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tag a new version
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < .harness/VERSION)"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            if ! git diff --quiet "v$v" "$GITHUB_SHA" -- .harness; then
              echo "FAIL: .harness/ on main differs from the released v$v, but VERSION was not raised; this kit change is unreleased."
              exit 1
            fi
            echo "v$v already exists at $(git rev-list -n 1 "v$v"); tags are immutable, nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node tools/check-kit.mjs
          node tools/test-harness.mjs
          git tag "v$v" "$GITHUB_SHA"
          git push origin "refs/tags/v$v"
          echo "Released v$v at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
