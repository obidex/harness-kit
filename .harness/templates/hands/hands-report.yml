# Harness Kit control repository (K007): the record and the alert for every hands run.
# Action group: auto (it checks, reports, alerts or wakes by itself; .harness/tools/actions.mjs)
# Each run that changed something adds one comment, listing every write, to this month's log issue
# here. Alerts follow the owner's one standard (O10, K010, `.harness/alerts.md`): a failure is one
# problem, kept as an issue here, sent once to the "Kit & Hands" topic; a repeat only comments on that
# issue; the next green run replies RESOLVED to the Telegram message and closes the issue. A run whose jobs
# record a result per repository (hands-settings' applies) keeps one alert per repository instead: only that
# repository's own green apply closes it (K062).
name: hands-report

on:
  workflow_call:
    inputs:
      job:
        required: true
        type: string
      result:
        required: true
        type: string
      # the result of the part that is not one repository's job (hands-settings: the drift check), K062
      whole:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hands
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: logs
          pattern: log-*
        continue-on-error: true
      - name: Log every write
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # one artifact unpacks straight into logs/ (download-artifact v5 and later), several into a folder each
          writes="$(cat logs/log.txt logs/*/log.txt 2>/dev/null | grep -E ': (applied|opened) ' || true)"
          [ -z "$writes" ] && { echo "No writes this run." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          title="hands log $(date -u +%Y-%m)"
          n="$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          [ -n "$n" ] || n="$(gh issue create --title "$title" --body "Every write the hands App made this month, one comment per run." | grep -oE '[0-9]+$')"
          printf '%s · %s\n\n%s\n' "$JOB" "$url" "$writes" | gh issue comment "$n" --body-file -
      # notify.mjs from the kit tag this repository pins, never another copy (K007.7)
      - if: inputs.result == 'failure' || inputs.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - if: inputs.result == 'failure' || inputs.result == 'success'
        id: kit
        run: echo "ref=v$(tr -d '[:space:]' < control/HANDS_KIT_VERSION)" >> "$GITHUB_OUTPUT"
      - if: inputs.result == 'failure' || inputs.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HARNESS_KIT_REPO || 'obidex/harness-kit' }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false
      - name: A failure is one problem; a green run resolves it
        if: inputs.result == 'failure' || inputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
          RESULT: ${{ inputs.result }}
          WHOLE: ${{ inputs.whole }}
          ALERTS_STORE: github:${{ github.repository }}
          ALERTS_REQUIRE_SEND: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_CHAT_ID_FILE: control/ALERTS_CHAT_ID
        run: |
          set -euo pipefail
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # one line "<owner/name> success|failure" per repository job (K062); anything else is ignored
          per="$(cat logs/result.txt logs/*/result.txt 2>/dev/null | grep -E '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+ (success|failure)$' || true)"
          if [ -n "$per" ]; then
            failed=0
            while read -r repo res; do
              if [ "$res" = failure ]; then
                failed=1
                node kit/.harness/tools/notify.mjs ops --key "hands/$JOB/$repo" --text "$JOB failed for $repo in ${{ github.repository }}" --link "$url" </dev/null
              else
                node kit/.harness/tools/notify.mjs resolve --key "hands/$JOB/$repo" --text "$JOB green again for $repo: $url" </dev/null
              fi
            done <<<"$per"
            # a failure outside the repository jobs (the drift check, or a job that recorded no result) is the
            # job's own alert, whatever the applies did; nothing here closes it: a full check with nothing left to apply does
            if [ "${WHOLE:-}" = failure ] || { [ "$RESULT" = failure ] && [ "$failed" = 0 ]; }; then
              node kit/.harness/tools/notify.mjs ops --key "hands/$JOB" --text "$JOB failed in ${{ github.repository }}" --link "$url"
            fi
            exit 0
          fi
          # a caller that keeps alerts per repository (it passes `whole`) never closes its job's own alert on a
          # green run, even when no result could be read (the download failed)
          if [ -n "${WHOLE:-}" ]; then
            if [ "$RESULT" = failure ]; then
              node kit/.harness/tools/notify.mjs ops --key "hands/$JOB" --text "$JOB failed in ${{ github.repository }}" --link "$url"
            fi
            exit 0
          fi
          if [ "$RESULT" = failure ]; then
            # technical: recorded as this repository's alert issue, never the owner's Telegram (K039); a host's reader mirrors it to the Ops board
            node kit/.harness/tools/notify.mjs ops --key "hands/$JOB" --text "$JOB failed in ${{ github.repository }}" --link "$url"
          else
            node kit/.harness/tools/notify.mjs resolve --key "hands/$JOB" --text "$JOB green again: $url"
          fi
