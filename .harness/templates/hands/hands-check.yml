# Harness Kit control repository (K007): the required check on this repository's pull requests.
# Action group: auto (it checks, reports, alerts or wakes by itself; .harness/tools/actions.mjs)
# It needs no secret: it validates the settings file and the workflow files with the pinned kit.
name: hands-check

on:
  pull_request:
    # edited: a description changed after the check ran is judged again (O09)
    types: [opened, synchronize, reopened, edited]
  # Each merge is checked again on main (C13): without it main has no check of its own, and a
  # workflow file GitHub cannot read is the only run a push ever shows.
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hands-check-${{ github.ref }}
  # a newer push replaces a pull request's run; a run that started on main is never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hands-check:
    name: hands-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: kit
        run: echo "ref=v$(tr -d '[:space:]' < HANDS_KIT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HARNESS_KIT_REPO || 'obidex/harness-kit' }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false
      - name: Settings file is valid
        run: node kit/.harness/tools/hands.mjs validate .
      - name: Every job that can reach the App key runs only from main
        run: node kit/.harness/tools/hands.mjs control-check .
      - name: No Claude footer in the pull request description (O09)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: node kit/.harness/tools/guard.mjs pr-body --repo "$REPO" --pr "$PR"
