# Harness Kit control repository (K007): copied into the owner's control repository, never into a project.
# Applies each enrolled repository's .github/harness-settings.json (from its default branch, so only
# reviewed and merged settings) with the hands App, at two moments (K008, resource rule O13):
# - on dispatch, right after a PR that changes a settings file merges: the merging session runs
#   this workflow with `repo` set (the authorized trigger; no session ever holds the key);
# - once a day, a drift check: one read-only job compares every enrolled repository with its file,
#   and only a repository that differs gets an apply job. An unchanged day costs one short job.
# The App key lives in the `hands` environment, which only this repository's main branch can use;
# every write token is minted for one job, one repository and the permissions that job needs.
# Emergency stop: the Actions variable HANDS_PAUSED (README "Emergency").
# The daily run also does the alert standard's daily work (O10, K010): escalations and STILL OPEN
# replies for this repository's open problems, and the one digest in the "Daily" topic at 08:17
# Damascus time, and the missed-run check: a PROBLEM in "Kit & Hands" for any of this repository's
# scheduled workflows more than 36 hours overdue (GitHub's schedules are best-effort), RESOLVED once
# it has run again. No extra job: steps in the drift check's job. This run cannot report its own
# silence; a host's tick runs the same check (stale.mjs schedules) to cover it.
name: hands-settings

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: One repository (owner/name) instead of every enrolled one
        required: false

permissions:
  contents: read

concurrency:
  group: hands-settings
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hands
    permissions:
      actions: read
      contents: read
      issues: write
    outputs:
      repos: ${{ steps.find.outputs.repos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: kit
        run: echo "ref=v$(tr -d '[:space:]' < HANDS_KIT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.HARNESS_KIT_REPO || 'obidex/harness-kit' }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false
      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          # GitHub hides a ruleset's bypass list (and some merge settings) from a read-only token, so
          # the check would see false drift every day. Drift itself only reads: HANDS_READ_ONLY
          # makes the tool refuse any write, and this job runs only the pinned kit (K008).
          permission-contents: read
          permission-metadata: read
          permission-administration: write
          permission-issues: read
      - id: find
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ONLY: ${{ inputs.repo }}
          HANDS_PAUSED: ${{ vars.HANDS_PAUSED }}
          HANDS_READ_ONLY: '1'
        run: |
          set -uo pipefail
          # one repository's failed check must not stop the others being applied
          rc=0; repos="$(node kit/.harness/tools/hands.mjs drift ${ONLY:+--only "$ONLY"})" || rc=$?
          echo "repos=${repos:-[]}" >> "$GITHUB_OUTPUT"
          echo "To apply: ${repos:-[]}" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      # a full check that found nothing to apply is green: it closes an open hands-settings problem
      - name: Resolve an open hands-settings problem
        if: success() && inputs.repo == '' && steps.find.outputs.repos == '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS_STORE: github:${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_CHAT_ID_FILE: ALERTS_CHAT_ID
        run: |
          node kit/.harness/tools/notify.mjs resolve --key hands/hands-settings --text "hands-settings green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Escalate and remind this repository's open problems
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_CHAT_ID_FILE: ALERTS_CHAT_ID
        run: node kit/.harness/tools/notify.mjs tick --stores "github:${{ github.repository }}"
      - name: The daily digest, across every enrolled repository
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SELF: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_CHAT_ID_FILE: ALERTS_CHAT_ID
        run: |
          set -euo pipefail
          stores="$(node kit/.harness/tools/hands.mjs discover | node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")).map(r=>r.repo);console.log([...new Set([process.env.SELF,...a])].map(r=>"github:"+r).join(","))')"
          node kit/.harness/tools/notify.mjs digest --stores "$stores"
      # a full check: a PROBLEM per scheduled workflow here more than 36 h overdue, RESOLVED once it ran
      - name: Missed scheduled runs
        if: always() && inputs.repo == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS_STORE: github:${{ github.repository }}
          ALERTS_TOPIC: kit
          HARNESS_SCHEDULE_OVERDUE_HOURS: ${{ vars.HARNESS_SCHEDULE_OVERDUE_HOURS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_CHAT_ID_FILE: ALERTS_CHAT_ID
        run: |
          set -euo pipefail
          node kit/.harness/tools/stale.mjs schedules --repo "$GITHUB_REPOSITORY" --alert | tee -a "$GITHUB_STEP_SUMMARY"

  apply:
    needs: discover
    # only repositories that differ from their file; one that failed its check does not stop the rest
    # and never after the run was cancelled (an emergency stop)
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.discover.outputs.repos != '' && needs.discover.outputs.repos != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hands
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.discover.outputs.repos) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: kit
        run: echo "ref=v$(tr -d '[:space:]' < HANDS_KIT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.HARNESS_KIT_REPO || 'obidex/harness-kit' }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false
      - id: name
        env:
          REPO: ${{ matrix.repo }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.name.outputs.name }}
          permission-administration: write
          permission-issues: write
          permission-contents: read
      - name: Apply the settings file, then read it back
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ matrix.repo }}
          HANDS_PAUSED: ${{ vars.HANDS_PAUSED }}
        run: |
          set -euo pipefail
          node kit/.harness/tools/hands.mjs apply --repo "$REPO" | tee "$RUNNER_TEMP/log.txt"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: log-${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/log.txt
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [discover, apply]
    # only when something was applied or failed: an unchanged day adds no job
    if: always() && github.ref == 'refs/heads/main' && (needs.discover.result == 'failure' || needs.apply.result == 'success' || needs.apply.result == 'failure')
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/hands-report.yml
    with:
      job: hands-settings
      result: ${{ (needs.discover.result == 'failure' || needs.apply.result == 'failure') && 'failure' || 'success' }}
    secrets: inherit
