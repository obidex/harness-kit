# Harness Kit control repository (K007): copied into the owner's control repository, never into a project.
# Applies each enrolled repository's .github/harness-settings.json (from its default branch, so only
# reviewed and merged settings) with the hands App, at two moments (K008, resource rule O13):
# - on dispatch, right after a PR that changes a settings file merges: the merging session runs
#   this workflow with `repo` set (the authorized trigger; no session ever holds the key);
# - once a day, a drift check: one read-only job compares every enrolled repository with its file,
#   and only a repository that differs gets an apply job. An unchanged day costs one short job.
# The App key lives in the `hands` environment, which only this repository's main branch can use;
# every write token is minted for one job, one repository and the permissions that job needs.
# Emergency stop: the Actions variable HANDS_PAUSED (README "Emergency").
name: hands-settings

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: One repository (owner/name) instead of every enrolled one
        required: false

permissions:
  contents: read

concurrency:
  group: hands-settings
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hands
    outputs:
      repos: ${{ steps.find.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - id: kit
        run: echo "ref=v$(tr -d '[:space:]' < HANDS_KIT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.HARNESS_KIT_REPO || 'obidex/harness-kit' }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          # read-only across the installation: compare live settings with each file
          permission-contents: read
          permission-metadata: read
          permission-administration: read
          permission-issues: read
      - id: find
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ONLY: ${{ inputs.repo }}
          HANDS_PAUSED: ${{ vars.HANDS_PAUSED }}
        run: |
          set -uo pipefail
          repos="$(node kit/.harness/tools/hands.mjs drift ${ONLY:+--only "$ONLY"})"; rc=$?
          echo "repos=${repos:-[]}" >> "$GITHUB_OUTPUT"
          echo "To apply: ${repos:-[]}" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  apply:
    needs: discover
    # only repositories that differ from their file; one that failed its check does not stop the rest
    if: always() && github.ref == 'refs/heads/main' && needs.discover.outputs.repos != '' && needs.discover.outputs.repos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hands
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.discover.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
      - id: kit
        run: echo "ref=v$(tr -d '[:space:]' < HANDS_KIT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.HARNESS_KIT_REPO || 'obidex/harness-kit' }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false
      - id: name
        env:
          REPO: ${{ matrix.repo }}
        run: echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.name.outputs.name }}
          permission-administration: write
          permission-issues: write
          permission-contents: read
      - name: Apply the settings file, then read it back
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ matrix.repo }}
          HANDS_PAUSED: ${{ vars.HANDS_PAUSED }}
        run: |
          set -euo pipefail
          node kit/.harness/tools/hands.mjs apply --repo "$REPO" | tee "$RUNNER_TEMP/log.txt"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/log.txt
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [discover, apply]
    # only when something was applied or failed: an unchanged day adds no job
    if: always() && github.ref == 'refs/heads/main' && (needs.discover.result == 'failure' || needs.apply.result == 'success' || needs.apply.result == 'failure')
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/hands-report.yml
    with:
      job: hands-settings
      result: ${{ (needs.discover.result == 'failure' || needs.apply.result == 'failure') && 'failure' || 'success' }}
    secrets: inherit
