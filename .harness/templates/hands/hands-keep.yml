# Harness Kit control repository (K007, K012): copied into the owner's control repository, never into a project.
# Keeps the kit update PRs that hands-update opens current. Under a strict required-checks rule such a
# PR goes "behind" when its base branch moves, and GitHub's auto-merge then waits forever: it never
# updates the branch itself. Each run brings every behind one up to date through the App (GitHub's
# update-branch), so the project's checks run again on the new head and auto-merge goes on. No
# session has to do it by hand.
# It runs only while such a PR is open: hands-update turns this workflow on, and runs it once, when it
# opens or finds one; the first run that finds none (younger than HANDS_KEEP_HOURS, default 72) turns
# it off again. A workflow turned off this way is not a missed schedule (stale.mjs schedules).
# Cost (O13): one one-minute job an hour while on, plus one report job when it writes, fails or turns
# itself off: about 2-4 GitHub-hosted minutes per kit update, at most about 75 for a PR left open 3 days.
name: hands-keep

on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# The newest run replaces an older one. A run can stick before it starts (GitHub left one "waiting"
# for two days in October 2026); with cancel-in-progress off, every later run queued behind it and was
# cancelled in turn, so nothing was kept current. A run only reads PRs and updates behind ones, so
# stopping one part-way loses nothing: the next does the same work.
concurrency:
  group: hands-keep
  cancel-in-progress: true

jobs:
  keep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hands
    permissions:
      actions: write
      contents: read
    outputs:
      wrote: ${{ steps.keep.outputs.wrote }}
      idle: ${{ steps.keep.outputs.idle }}
    steps:
      # only code from the kit tag this repository pins runs here (K007.7)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: control
          persist-credentials: false
      - id: kit
        run: echo "ref=v$(tr -d '[:space:]' < control/HANDS_KIT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.HARNESS_KIT_REPO || 'obidex/harness-kit' }}
          ref: ${{ steps.kit.outputs.ref }}
          path: kit
          persist-credentials: false
      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.HARNESS_APP_ID }}
          private-key: ${{ secrets.HARNESS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write
          permission-workflows: write
      - id: keep
        name: Bring every behind kit update PR up to date
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          HANDS_KEEP_HOURS: ${{ vars.HANDS_KEEP_HOURS }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          node kit/.harness/tools/hands.mjs keep > "$RUNNER_TEMP/keep.json" 2> "$RUNNER_TEMP/log.txt" || rc=$?
          cat "$RUNNER_TEMP/log.txt" >&2
          watched="$(jq -r '.watched // 1' "$RUNNER_TEMP/keep.json" 2>/dev/null || echo 1)"
          updated="$(jq -r '.updated // 0' "$RUNNER_TEMP/keep.json" 2>/dev/null || echo 0)"
          [ "$updated" -gt 0 ] && echo "wrote=1" >> "$GITHUB_OUTPUT"
          if [ "$rc" = 0 ] && [ "$watched" = 0 ]; then
            # nothing left to keep: off until hands-update opens the next PR
            GH_TOKEN="$ACTIONS_TOKEN" gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/hands-keep.yml/disable" || rc=1
            echo "idle=1" >> "$GITHUB_OUTPUT"
            echo "No kit update PR open; hands-keep turned itself off." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: log-keep
          path: ${{ runner.temp }}/log.txt
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: keep
    # a quiet run (nothing behind, nothing failed, still watching) starts no second job
    if: always() && github.ref == 'refs/heads/main' && (needs.keep.result == 'failure' || needs.keep.outputs.wrote == '1' || needs.keep.outputs.idle == '1')
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/hands-report.yml
    with:
      job: hands-keep
      result: ${{ needs.keep.result == 'failure' && 'failure' || 'success' }}
    secrets: inherit
